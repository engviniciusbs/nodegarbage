- id: editors.vscode_cache
  name: Cache do VS Code
  category: dev-cache
  match:
    path: '%APPDATA%\Code\Cache'
  verdict: safe
  regenerable: o VS Code recria ao abrir
  action: delete_contents
  explain: Cache de recursos do VS Code. Pode limpar com o editor fechado, ele recria tudo sozinho.

- id: editors.vscode_cacheddata
  name: CachedData do VS Code
  category: dev-cache
  match:
    path: '%APPDATA%\Code\CachedData'
  verdict: safe
  regenerable: o VS Code recria ao abrir
  action: delete_contents
  explain: Código JavaScript pré-compilado do VS Code. É regenerado na próxima abertura, que pode ficar um pouco mais lenta.

- id: editors.jetbrains_cache
  name: Caches das IDEs JetBrains
  category: dev-cache
  match:
    path: '%LOCALAPPDATA%\JetBrains'
  verdict: caution
  regenerable: a IDE reindexa ao abrir o projeto
  action: manual
  command: Use 'Invalidate Caches' na IDE ou apague apenas as pastas de cache de versões antigas
  explain: Esta pasta guarda caches e índices das IDEs JetBrains (IntelliJ, Rider, PyCharm e afins), mas também o JetBrains Toolbox com as próprias IDEs instaladas, além de logs e ajustes locais. Por isso o app não apaga a pasta inteira. Use File → Invalidate Caches na IDE, ou apague à mão só as pastas de versões antigas que você não usa mais.
