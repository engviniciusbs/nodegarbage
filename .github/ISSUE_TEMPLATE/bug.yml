name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the bug could cause the wrong files to be deleted, do NOT file it here. Follow SECURITY.md and report it privately.
  - type: input
    id: version
    attributes:
      label: NodeGarbage version
      description: From the release name, or "dev" for source builds.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: For example Windows 11 23H2 (build 22631), or Windows 10 22H2.
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: Running as administrator?
      options: ["No", "Yes"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages. Remove personal paths if you prefer.
    validations:
      required: true
