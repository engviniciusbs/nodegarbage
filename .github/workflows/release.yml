name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $v = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          go install "github.com/wailsapp/wails/v2/cmd/wails@$v"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build (portable exe + NSIS installer)
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          wails build -clean -nsis -ldflags "-X main.version=${{ github.ref_name }}"

      - name: Generate SHA256SUMS
        shell: pwsh
        working-directory: build/bin
        run: |
          Get-ChildItem -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Out-File -FilePath SHA256SUMS -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/bin/nodegarbage.exe
            build/bin/*-installer.exe
            build/bin/SHA256SUMS
