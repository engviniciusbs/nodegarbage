name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CI_NO_RECYCLE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $v = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          go install "github.com/wailsapp/wails/v2/cmd/wails@$v"

      # frontend/dist/.gitkeep is tracked so //go:embed all:frontend/dist always
      # resolves, which lets Go tooling load package main before the frontend builds.
      - name: Generate Wails JS bindings
        run: wails generate module

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend type check
        run: npm --prefix frontend run check

      - name: Frontend tests
        run: npm --prefix frontend test -- --run

      - name: gofmt
        shell: bash
        run: |
          out=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$out" ]; then
            echo "Files not formatted with gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: wails build
        run: wails build -clean
